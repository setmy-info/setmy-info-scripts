# Minikube-specific Argo Workflow: uses NFS PVC (generator-nfs-persistent-volume-claim)
# mounted from the host's own NFS server.  No in-cluster NFS deployment needed.
# The PVC root = /mnt/gintra/organizations/ee/has on the host.
#
# Directory layout under the PVC (host-side):
#   operations/
#     ai/
#     packages/
#     workflows/
#
# Prerequisites:
#   kubectl apply -f 00-generator-namespace.yaml
#   minikube-setup.sh  (applies PV, PVC, RBAC, secrets)
#   Argo Workflows installed in the cluster
#
# Submit:
#   argo submit -n generator --watch 09-minikube-generator-argo.yaml
# or use argo-wf.cmd for auto-generated UUID, model selection and file attachments.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
    generateName: generator-argo-
    namespace: generator
spec:
    serviceAccountName: default
    entrypoint: pipeline

    volumes:
        -   name: nfs-has-org
            persistentVolumeClaim:
                claimName: generator-nfs-persistent-volume-claim

    arguments:
        parameters:
            -   name: cc
                value: "ee"
            -   name: org
                value: "has"
            -   name: uuid
                value: "00000000-0000-0000-0000-000000000000"
            -   name: model
                value: "claude-sonnet-4-6"
            -   name: files
                value: ""

    templates:
        -   name: pipeline
            steps:
                -   -   name: make-working-dir
                        template: make-working-dir
                        arguments:
                            parameters:
                                -   name: cc
                                    value: "{{workflow.parameters.cc}}"
                                -   name: org
                                    value: "{{workflow.parameters.org}}"
                                -   name: uuid
                                    value: "{{workflow.parameters.uuid}}"
                -   -   name: run-claude
                        template: run-claude
                        arguments:
                            parameters:
                                -   name: cc
                                    value: "{{workflow.parameters.cc}}"
                                -   name: org
                                    value: "{{workflow.parameters.org}}"
                                -   name: uuid
                                    value: "{{workflow.parameters.uuid}}"
                                -   name: model
                                    value: "{{workflow.parameters.model}}"
                                -   name: files
                                    value: "{{workflow.parameters.files}}"

        -   name: make-working-dir
            inputs:
                parameters:
                    -   name: cc
                    -   name: org
                    -   name: uuid
                    -   name: script
                        default: make-working-dir
            container:
                image: alpine
                env:
                    -   name: SMI_CC
                        value: "{{inputs.parameters.cc}}"
                    -   name: SMI_ORG
                        value: "{{inputs.parameters.org}}"
                    -   name: SMI_WF_UUID
                        value: "{{inputs.parameters.uuid}}"
                command: [ sh ]
                args:
                    - "/mnt/gintra/organizations/{{inputs.parameters.cc}}/{{inputs.parameters.org}}/operations/packages/scripts/{{inputs.parameters.script}}.sh"
                volumeMounts:
                    -   name: nfs-has-org
                        mountPath: "/mnt/gintra/organizations/{{inputs.parameters.cc}}/{{inputs.parameters.org}}"

        -   name: run-claude
            inputs:
                parameters:
                    -   name: cc
                    -   name: org
                    -   name: uuid
                    -   name: model
                        default: claude-sonnet-4-6
                    -   name: files
                        default: ""
                    -   name: script
                        default: run-claude
            container:
                image: alpine
                workingDir: "/mnt/gintra/organizations/{{inputs.parameters.cc}}/{{inputs.parameters.org}}/operations/ai/{{inputs.parameters.uuid}}"
                env:
                    -   name: SMI_CC
                        value: "{{inputs.parameters.cc}}"
                    -   name: SMI_ORG
                        value: "{{inputs.parameters.org}}"
                    -   name: SMI_WF_UUID
                        value: "{{inputs.parameters.uuid}}"
                    -   name: SMI_MODEL
                        value: "{{inputs.parameters.model}}"
                    -   name: SMI_FILES
                        value: "{{inputs.parameters.files}}"
                    -   name: ANTHROPIC_API_KEY
                        valueFrom:
                            secretKeyRef:
                                name: generator-secrets
                                key: anthropic-api-key
                command: [ sh ]
                args:
                    - "/mnt/gintra/organizations/{{inputs.parameters.cc}}/{{inputs.parameters.org}}/operations/packages/scripts/{{inputs.parameters.script}}.sh"
                volumeMounts:
                    -   name: nfs-has-org
                        mountPath: "/mnt/gintra/organizations/{{inputs.parameters.cc}}/{{inputs.parameters.org}}"
