# Traefik v3 ServersTransport: skip TLS certificate verification for the
# argo-server backend.
#
# Argo Workflows generates a self-signed cert on port 2746 at startup.
# Traefik terminates TLS for the browser using the cert from argo-tls-secret
# (generated by generate-cert.sh), then forwards the request to the backend
# over HTTPS. Without this resource Traefik would reject the argo-server
# self-signed cert and return a 502.
#
# Referenced by the Ingress annotation:
#   traefik.ingress.kubernetes.io/service.servertransport: argo-insecure@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
    name: argo-insecure
    namespace: argo
spec:
    insecureSkipVerify: true
