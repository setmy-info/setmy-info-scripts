# nginx service hardening, ready to activate with a symbolic link:
#
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo ln -f -s /opt/setmy.info/etc/systemd/system/nginx.service.d/hardening.conf /etc/systemd/system/nginx.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart nginx

[Service]
UMask=0027
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL CAP_SETGID CAP_SETUID
AmbientCapabilities=
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
